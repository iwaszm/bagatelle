<!DOCTYPE html>

    <link rel="stylesheet" href="../assets/css/site.css">
    <style>
        .zvg-shell { min-height: calc(100vh - 78px); padding: 18px 24px 24px; }
        .zvg-filter { background: rgba(255,253,248,.86); backdrop-filter: blur(14px); border: 1px solid rgba(185,138,53,.18); border-radius: 22px; box-shadow: 0 18px 50px rgba(24,33,47,.08); }

        .zvg-list-pane { height: 100%; overflow: auto; padding-right: 4px; }
        .zvg-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
        .zvg-map-pane { position: sticky; top: 92px; height: 100%; min-height: 0; border-radius: 26px; overflow: hidden; border: 1px solid rgba(24,33,47,.08); box-shadow: 0 18px 50px rgba(24,33,47,.10); background: #f4efe4; }

        .leaflet-container { overflow: hidden; touch-action: pan-x pan-y; }
        .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
        .leaflet-container .leaflet-overlay-pane svg { max-width: none !important; max-height: none !important; }
        .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { user-select: none; -webkit-user-drag: none; }
        .leaflet-tile { width: 256px; height: 256px; max-width: none !important; max-height: none !important; }
        .leaflet-pane { z-index: 400; } .leaflet-tile-pane { z-index: 200; } .leaflet-overlay-pane { z-index: 400; } .leaflet-marker-pane { z-index: 600; } .leaflet-tooltip-pane { z-index: 650; } .leaflet-popup-pane { z-index: 700; }
        .leaflet-control { position: relative; z-index: 800; pointer-events: auto; } .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; } .leaflet-top { top: 0; } .leaflet-right { right: 0; } .leaflet-bottom { bottom: 0; } .leaflet-left { left: 0; }
        .leaflet-control-zoom { margin: 12px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(24,33,47,.18); } .leaflet-control-zoom a { display: block; width: 34px; height: 34px; line-height: 34px; text-align: center; background: #fffdf8; color: #18212f; text-decoration: none; font-weight: 900; }
        .leaflet-popup { position: absolute; text-align: center; margin-bottom: 20px; } .leaflet-popup-content-wrapper { position: relative; text-align: left; } .leaflet-popup-tip-container { position: absolute; left: 50%; margin-left: -20px; width: 40px; height: 20px; overflow: hidden; pointer-events: none; } .leaflet-popup-tip { width: 17px; height: 17px; padding: 1px; margin: -10px auto 0; transform: rotate(45deg); background: #fffdf8; }
        .zvg-map-pane .leaflet-container { font-family: 'IBM Plex Sans', 'Noto Serif SC', sans-serif; background: #f4efe4; }
        .zvg-card { height: 100%; min-height: 460px; display: flex; flex-direction: column; background: #fffdf8; border: 1px solid rgba(24,33,47,.08); border-radius: 24px; overflow: hidden; box-shadow: 0 14px 36px rgba(24,33,47,.08); transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
        .zvg-card:hover, .zvg-card.is-active { transform: translateY(-3px); border-color: rgba(185,138,53,.72); box-shadow: 0 20px 56px rgba(24,33,47,.13); }
        .zvg-thumb { height: 145px; flex: 0 0 145px; background: linear-gradient(135deg, #e9dcc1, #f7f0e3); display: flex; align-items: center; justify-content: center; color: #8a6b38; font-weight: 800; letter-spacing: .08em; }
        .zvg-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .zvg-badge { display: inline-flex; align-items:center; gap: 6px; border-radius: 999px; padding: 5px 10px; background: rgba(35,78,156,.08); color: #234e9c; font-size: 11px; font-weight: 800; }
        .zvg-badge-apartment { background: rgba(35,78,156,.10); color: #234e9c; }
        .zvg-badge-house { background: rgba(47,143,103,.11); color: #247554; }
        .zvg-badge-land { background: rgba(185,138,53,.14); color: #8a5f18; }
        .zvg-badge-commercial { background: rgba(111,88,182,.12); color: #5b469e; }
        .zvg-badge-other { background: rgba(132,63,55,.10); color: #843f37; }
        .zvg-card-body { position: relative; flex: 1; display: flex; flex-direction: column; }
        .zvg-card-links { margin-top: auto; }
        .zvg-card-index { position: absolute; right: 12px; bottom: 12px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 999px; background: #18212f; color: #fffaf0; border: 2px solid #fffdf8; box-shadow: 0 8px 18px rgba(24,33,47,.18); font-size: 12px; font-weight: 900; z-index: 2; }
        .zvg-price { color: #843f37; font-weight: 900; font-size: 20px; letter-spacing: -.02em; }
        .zvg-meta { color: #667085; font-size: 12px; }
        .zvg-empty { border: 1px dashed rgba(24,33,47,.16); border-radius: 24px; padding: 42px; text-align: center; color: #667085; background: rgba(255,253,248,.62); }
        .zvg-marker { width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; background: #843f37; color: #fffaf0; border: 2px solid #fffaf0; box-shadow: 0 8px 22px rgba(24,33,47,.28); font-size: 11px; font-weight: 900; opacity: .88; transition: transform .18s ease, background .18s ease, opacity .18s ease; }

        .zvg-map-popup .leaflet-popup-content-wrapper { border-radius: 18px; background: #fffdf8; color: #18212f; box-shadow: 0 20px 56px rgba(24,33,47,.22); }
        .zvg-map-popup .leaflet-popup-content { width: clamp(280px, 32vw, 380px) !important; max-height: min(560px, 72dvh); overflow: auto; margin: 14px; }
        .zvg-map-infobox { position: relative; display: grid; gap: 8px; padding-top: 2px; }
        .zvg-map-popup-index { position: absolute; right: -4px; bottom: -6px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 999px; background: #18212f; color: #fffaf0; border: 2px solid #fffaf0; box-shadow: 0 8px 18px rgba(24,33,47,.22); font-size: 12px; font-weight: 900; }
        .zvg-map-popup-title { font-weight: 900; line-height: 1.28; min-height: 44px; padding: 10px 11px; border-radius: 14px; background: rgba(24,33,47,.06); overflow-wrap: anywhere; }
        .zvg-map-popup-price { color: #843f37; font-weight: 900; font-size: 18px; min-height: 38px; display: flex; align-items: center; padding: 6px 10px; border-radius: 13px; background: rgba(132,63,55,.08); }
        .zvg-map-popup-row { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; align-items: start; min-height: 34px; padding: 8px 10px; border-radius: 13px; background: rgba(255,255,255,.72); border: 1px solid rgba(24,33,47,.07); }
        .zvg-map-popup-row dt { color: #8a94a6; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; }
        .zvg-map-popup-row dd { margin: 0; color: #18212f; font-size: 12px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
        .zvg-map-popup-links { min-height: 30px; padding: 8px 10px; border-radius: 13px; background: rgba(35,78,156,.07); overflow-wrap: anywhere; }
        @media (max-width: 1500px) { .zvg-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 1180px) { .zvg-results-layout { grid-template-columns: minmax(0, 1fr); height: auto; } .zvg-grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); } .zvg-list-pane { max-height: none; height: auto; } .zvg-map-pane { position: relative; top: 0; min-height: 360px; height: min(72dvh, var(--zvg-map-height, 640px)); } }

        <section class="zvg-filter p-4 md:p-5">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
                <label class="text-xs text-gray-500 font-semibold">Land / Bundesland
                    <select id="zvgLand" class="bagatelle-input mt-1"></select>
                </label>
                <label class="text-xs text-gray-500 font-semibold">Gericht / Amtsgericht
                    <select id="zvgCourt" class="bagatelle-input mt-1"></select>
                </label>
                <label class="text-xs text-gray-500 font-semibold">Objektart
                    <select id="zvgObject" class="bagatelle-input mt-1"></select>
                </label>
                <label class="text-xs text-gray-500 font-semibold">价格上限 / Verkehrswert max
                    <span class="money-field mt-1"><input id="zvgMaxPrice" type="text" inputmode="numeric" placeholder="例如 500.000" class="bagatelle-input money-input"><span class="input-unit">€</span></span>

            <aside class="zvg-map-pane" aria-label="项目地图">
